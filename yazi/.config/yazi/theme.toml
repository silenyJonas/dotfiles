# Yazi v barvách Islandu: zaoblené "pilulky" jako v liště a panelu
# barvy: modrá #7dbedc, tyrkys #9ccfd8, písek #ebcb8b, fialová #b48ead, zelená #a3be8c, červená #bf616a

[mgr]
cwd = { fg = "#7dbedc", bold = true }
border_symbol = "│"
border_style = { fg = "#2b4656" }
marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
marker_marked = { fg = "#ebcb8b", bg = "#ebcb8b" }
marker_selected = { fg = "#7dbedc", bg = "#7dbedc" }
count_copied = { fg = "#0a1e2c", bg = "#a3be8c" }
count_cut = { fg = "#0a1e2c", bg = "#bf616a" }
count_selected = { fg = "#0a1e2c", bg = "#7dbedc" }
find_keyword = { fg = "#ebcb8b", bold = true, italic = true }
find_position = { fg = "#b48ead", bold = true }
symlink_target = { fg = "#9ccfd8", italic = true }

# řádek pod kurzorem jako zaoblená pilulka
[indicator]
padding = { open = "", close = "" }
current = { fg = "#0a1e2c", bg = "#7dbedc", bold = true }
parent = { fg = "#dbe7ee", bg = "#2b4656" }
preview = { fg = "#dbe7ee", bg = "#1b3442" }

[tabs]
active = { fg = "#0a1e2c", bg = "#7dbedc", bold = true }
inactive = { fg = "#7f97a5", bg = "#16303f" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0a1e2c", bg = "#7dbedc", bold = true }
normal_alt = { fg = "#7dbedc", bg = "#16303f" }
select_main = { fg = "#0a1e2c", bg = "#a3be8c", bold = true }
select_alt = { fg = "#a3be8c", bg = "#16303f" }
unset_main = { fg = "#0a1e2c", bg = "#bf616a", bold = true }
unset_alt = { fg = "#bf616a", bg = "#16303f" }

[status]
overall = { fg = "#dbe7ee" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#7dbedc" }
perm_read = { fg = "#ebcb8b" }
perm_write = { fg = "#bf616a" }
perm_exec = { fg = "#a3be8c" }
perm_sep = { fg = "#7f97a5" }
progress_label = { fg = "#dbe7ee", bold = true }
progress_normal = { fg = "#7dbedc", bg = "#16303f" }
progress_error = { fg = "#bf616a", bg = "#16303f" }

# barvy souborů podle druhu
[filetype]
rules = [
  { mime = "image/*", fg = "#ebcb8b" },
  { mime = "{audio,video}/*", fg = "#b48ead" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bf616a" },
  { mime = "application/{pdf,doc,rtf}", fg = "#9ccfd8" },
  { url = "*", is = "orphan", fg = "#bf616a", italic = true },
  { url = "*", is = "exec", fg = "#a3be8c" },
  { url = "*/", fg = "#7dbedc", bold = true },
  { url = "*", fg = "#dbe7ee" },
]
