# Yazi v barvách Islandu: zaoblené "pilulky" jako v liště a panelu
# barvy: modrá #ffffff, tyrkys #d0d0d0, písek #ffd166, fialová #c2c2c2, zelená #00ff9c, červená #ff003c

[mgr]
cwd = { fg = "#ffffff", bold = true }
border_symbol = "│"
border_style = { fg = "#2a2a2a" }
marker_copied = { fg = "#00ff9c", bg = "#00ff9c" }
marker_cut = { fg = "#ff003c", bg = "#ff003c" }
marker_marked = { fg = "#ffd166", bg = "#ffd166" }
marker_selected = { fg = "#ffffff", bg = "#ffffff" }
count_copied = { fg = "#000000", bg = "#00ff9c" }
count_cut = { fg = "#000000", bg = "#ff003c" }
count_selected = { fg = "#000000", bg = "#ffffff" }
find_keyword = { fg = "#ffd166", bold = true, italic = true }
find_position = { fg = "#c2c2c2", bold = true }
symlink_target = { fg = "#d0d0d0", italic = true }

# řádek pod kurzorem jako zaoblená pilulka
[indicator]
padding = { open = "", close = "" }
current = { fg = "#000000", bg = "#ffffff", bold = true }
parent = { fg = "#ffffff", bg = "#2a2a2a" }
preview = { fg = "#ffffff", bg = "#161616" }

[tabs]
active = { fg = "#000000", bg = "#ffffff", bold = true }
inactive = { fg = "#a0a0a0", bg = "#111111" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#000000", bg = "#ffffff", bold = true }
normal_alt = { fg = "#ffffff", bg = "#111111" }
select_main = { fg = "#000000", bg = "#00ff9c", bold = true }
select_alt = { fg = "#00ff9c", bg = "#111111" }
unset_main = { fg = "#000000", bg = "#ff003c", bold = true }
unset_alt = { fg = "#ff003c", bg = "#111111" }

[status]
overall = { fg = "#ffffff" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#ffffff" }
perm_read = { fg = "#ffd166" }
perm_write = { fg = "#ff003c" }
perm_exec = { fg = "#00ff9c" }
perm_sep = { fg = "#a0a0a0" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#ffffff", bg = "#111111" }
progress_error = { fg = "#ff003c", bg = "#111111" }

# barvy souborů podle druhu
[filetype]
rules = [
  { mime = "image/*", fg = "#ffd166" },
  { mime = "{audio,video}/*", fg = "#c2c2c2" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff003c" },
  { mime = "application/{pdf,doc,rtf}", fg = "#d0d0d0" },
  { url = "*", is = "orphan", fg = "#ff003c", italic = true },
  { url = "*", is = "exec", fg = "#00ff9c" },
  { url = "*/", fg = "#ffffff", bold = true },
  { url = "*", fg = "#ffffff" },
]
