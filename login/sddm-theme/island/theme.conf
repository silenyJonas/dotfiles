[General]
# tapeta: kopii aktuální tapety z plochy sem automaticky ukládá island-sddm-bg
background=background.jpg
# barva hodin a zvýraznění
accent=#8fcdeb
# formát data nahoře vlevo (anglicky, např. Sunday, March 22)
dateFormat="dddd, MMMM d"
# po kolika sekundách nečinnosti se přihlášení vrátí na hodiny
idleSeconds=45
# rozmazaná tapeta pro přihlášení (také ji připravuje island-sddm-bg)
blurBackground=background-blur.jpg
