# Zamykání a uspávání obrazovky (hypridle)
general {
    lock_cmd = pidof hyprlock || python3 ~/.config/hypr/lock/lock.py   # loginctl lock-session, tlačítko Lock
    before_sleep_cmd = loginctl lock-session                           # před uspáním vždy zamknout
    after_sleep_cmd = hyprctl dispatch dpms on
}

# po 10 minutách nečinnosti zamknout
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# po 15 minutách vypnout obrazovku (pohnutí myší ji zapne)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
