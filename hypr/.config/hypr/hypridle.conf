# Zamykání a uspávání obrazovky (hypridle)
# Automatické zamknutí a zhasnutí po nečinnosti je vypnuté (no-idle.sh).
# Zamknout jde ručně (tlačítko Lock), před uspáním (zavření víka) se zamyká vždy.
general {
    lock_cmd = pidof hyprlock || python3 ~/.config/hypr/lock/lock.py   # loginctl lock-session, tlačítko Lock
    before_sleep_cmd = loginctl lock-session                           # před uspáním vždy zamknout
    after_sleep_cmd = hyprctl dispatch dpms on
}

